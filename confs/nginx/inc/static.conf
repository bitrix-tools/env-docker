#
# static files
#
location ~* ^.+\.(css|xml|mml|txt|jad|wml|htc|map|ts|js|atom|rss|war|ear|json|hqx|doc|docx|pdf|ps|eps|ai|rtf|m3u8|kml|kmz|xls|xlsx|eot|ppt|pptx|odg|odp|ods|odt|wmlc|cco|jar|jardiff|jnlp|run|pl|pm|prc|pdb|sea|swf|sit|tcl|tk|der|pem|crt|xpi|xspf|bin|exe|dll|rpm|deb|dmg|iso|img|msi|msp|msm|7z|bz2?|gz|zip|rar|tar|gif|jpg|jpeg|png|svg|svgz|tif|tiff|wbmp|webp|ico|jng|bmp|3gpp|3gp|mp4|mpeg|mpg|mov|webm|flv|m4v|mng|asx|asf|wmv|avi|mid|midi|kar|mp3|ogg|m4a|ra|mpe?g|wav|woff|woff2|ttf|otf)$ {
    log_not_found off;
    access_log off;
    expires 30d;
    add_header Cache-Control public;
}
#
# special static gif files
#
location ~* ^(/bitrix/images/landing/analytics/pixel.gif|/bitrix/images/1.gif) {
    log_not_found off;
    access_log off;
    expires 30d;
    add_header Cache-Control public;
}
#
# internal sources
#
location ~ (/bitrix/modules|/upload/support/not_image|/bitrix/php_interface|local/modules|local/php_interface) {
    internal;
}
#
# accept access for merged css and js
#
location ~* ^/bitrix/cache/(css/.+\.css|js/.+\.js)$ {
    expires 30d;
}
#
# static content
#
location ~* ^/(upload|bitrix/images|bitrix/tmp) {
    set $cdi $upstream_http_x_cd_info;
    if ($cdi) {
        more_set_headers -s 200 'Content-Disposition:$cdi';
    }
    expires 30d;
}
#
# fix xss on svg files in /upload/*
#
location ~* ^/upload/.+\.svg$ {
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
}
#
# download file from /upload/*, do not execute
#
location ~* ^/upload/.*([^/]+)\.(html|htm|php|php3|php4|php5|php6|pht|phtml|shtm|shtml|pl|asp|aspx|asmx|cgi|bin|dll|exe|fcg|fcgi|fpl|run|rpm|deb|dmg|iso|img|msi)$ {
    add_header Content-Disposition "attachment";
}
#
# upload sizes
#
location ~ /upload/ {
    client_body_buffer_size 1024m;
    client_max_body_size 1024m;
}
#
# local resize cache
#
# ^~ takes precedence over regex locations (including static jpeg-regex)
# $uri is updated with X-Accel-Redirect, $request_uri is not
#
location ^~ /upload/resize_cache/x/ {
    internal;
    set $new_uri $upstream_http_x_gen_src;
    set $cdi $upstream_http_x_cd_info;
    more_set_headers -s 200 "Content-Disposition: $cdi";
    try_files $resize_cache_encoded_path @genpreview;
}
#
location @genpreview {
    return 302 "$scheme://$host$new_uri";
}
#
# favicon.png
#
location = /favicon.png {
    log_not_found off;
    access_log off;
}
#
# robots.txt
#
location = /robots.txt {
    log_not_found off;
    access_log off;
}
#
# player options, disable no-sniff
#
location ~* ^/bitrix/components/bitrix/player/mediaplayer/player$ {
    add_header Access-Control-Allow-Origin *;
}
#
